core:
  - changed-files:
      - any-glob-to-any-file:
          - src/agentanvil/core/**

cli:
  - changed-files:
      - any-glob-to-any-file:
          - src/agentanvil/cli/**

backends:
  - changed-files:
      - any-glob-to-any-file:
          - src/agentanvil/backends/**

runner:
  - changed-files:
      - any-glob-to-any-file:
          - src/agentanvil/runner/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - README.md
          - CHANGELOG.md
          - CONTRIBUTING.md

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock

release:
  - head-branch: ['^release\/']
